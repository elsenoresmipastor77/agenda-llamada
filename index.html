<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Evita que Google indexe esta página puente -->
  <meta name="robots" content="noindex, nofollow">
  <title>Calendtors</title>

  <!--
    🖼️ LA TARJETA QUE ENSEÑA INSTAGRAM (2026-08-23)

    Sin esto, al lead le llegaba el enlace pelado en azul y debajo una tarjeta que decía
    "Redirigiendo…" — que es literalmente el <title> que tenía esta página. Al lado, el enlace
    DIRECTO de un closer (calendtors.com) se ve con la corona y el nombre, porque Calendtors sí trae
    sus Open Graph. La diferencia se nota justo en el mensaje del cierre, y confunde: parecen dos
    cosas distintas cuando llevan al mismo sitio.

    🔑 Son las MISMAS tres etiquetas que sirve Calendtors, copiadas a propósito para que las dos
    tarjetas se vean idénticas y no haya salto visual entre un lead y otro.
    ⚠️ `og:image` va ABSOLUTA: la de Calendtors es relativa (`/icon-512.png`) y desde este dominio
    no resolvería a nada.
    ⚠️ Y el `noindex` de arriba NO estorba: eso es para los buscadores. El scraper de Meta lee los
    og: igual — y tampoco ejecuta el JS de abajo, así que ve estas etiquetas y no el redirect.
  -->
  <meta property="og:title" content="Calendtors" />
  <meta property="og:description" content="Agenda tu llamada en el hueco que mejor te venga." />
  <meta property="og:image" content="https://calendtors.com/icon-512.png" />
  <meta property="og:url" content="https://elsenoresmipastor77.github.io/agenda-llamada/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="description" content="Agenda tu llamada en el hueco que mejor te venga." />
</head>
<body>

  <!-- Fallback por si alguien tiene JavaScript apagado -->
  <noscript>
    <p>Agenda tu llamada aquí:</p>
    <ul>
      <li><a href="https://calendtors.com/jose/escala-tu-marca-personal-junto-a-dios">Agendar con José</a></li>
      <li><a href="https://calendtors.com/lucas-ribera-rios/escala-tu-marca-personal-junto-a-dios-ne">Agendar con Lucas</a></li>
      <li><a href="https://calendtors.com/joan-rodriguez-roig/escala-tu-marca-personal-junto-a-dios-ne">Agendar con Joan</a></li>
    </ul>
  </noscript>

  <script>
    /* =========================================================
       TUS LINKS  (peso = cuánto tráfico recibe cada uno)

       Desde el 2026-08-21 el destino es CALENDTORS, la agenda
       propia, en vez de Calendly. Esta página NO cambia de URL a
       propósito: el bot manda "agenda-llamada" en 5 sitios del
       prompt y el Worker lo busca en el historial para saber si
       el link ya salió (AGENDA_LINK_RE, linkYaEnviado). Cambiar
       este enlace habría obligado a tocar todo eso.

       Si algún día quieres volver a repartir, añade otro destino
       aquí abajo con su peso: ej. { url: "...", peso: 30 }.
       ========================================================= */
    const destinos = [
      { url: "https://calendtors.com/jose/escala-tu-marca-personal-junto-a-dios",                  peso: 34 },  // José
      { url: "https://calendtors.com/lucas-ribera-rios/escala-tu-marca-personal-junto-a-dios-ne",  peso: 33 },  // Lucas
      { url: "https://calendtors.com/joan-rodriguez-roig/escala-tu-marca-personal-junto-a-dios-ne", peso: 33 }   // Joan
    ];

    // ---- De aquí para abajo no toques nada ----
    const total = destinos.reduce((suma, d) => suma + d.peso, 0);
    let r = Math.random() * total;
    let elegido = destinos[0].url;
    for (const d of destinos) {
      if (r < d.peso) { elegido = d.url; break; }
      r -= d.peso;
    }

    /* Rastreo del lead: el bot manda ...?lead=<id de ManyChat>. Lo reenviamos al
       destino como utm_content (Calendtors lo guarda con la reserva y lo devuelve
       en el webhook invitee.created), así el Worker sabe QUÉ lead de Instagram
       agendó y deja de hacerle seguimiento. */
    const lead = new URLSearchParams(location.search).get("lead");
    if (lead) {
      const sep = elegido.includes("?") ? "&" : "?";
      elegido += sep + "utm_content=" + encodeURIComponent(lead);
    }

    window.location.replace(elegido);
  </script>

</body>
</html>
